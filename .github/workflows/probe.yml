name: probe
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Paquets natifs
        run: |
          apt-get update >/dev/null
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends plasma-desktop plasma-desktop-data >/dev/null 2>&1 || apt-get install -y --no-install-recommends plasma-desktop
          echo "== propriétaire du dossier icontasks"; dpkg -S /usr/share/plasma/plasmoids/org.kde.plasma.icontasks 2>&1
          echo "== contenu"; find /usr/share/plasma/plasmoids/org.kde.plasma.icontasks -type f 2>&1 | head -20
          echo "== metadata"; cat /usr/share/plasma/plasmoids/org.kde.plasma.icontasks/metadata.json 2>&1 | head -30
          echo "== paquets plasma-desktop* contenant icontasks"; for p in plasma-desktop plasma-desktop-data; do echo "-- $p"; dpkg -L $p 2>/dev/null | grep -i icontasks; done
          echo "== .so task"; ls /usr/lib/x86_64-linux-gnu/qt6/plugins/plasma/applets | grep -i task
