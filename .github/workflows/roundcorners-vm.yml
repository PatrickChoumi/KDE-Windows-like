name: roundcorners-vm

# Feature 5.1 sur une VRAIE VM Ubuntu 26.04 (runner ubuntu-latest SANS conteneur : vrai noyau, /dev/dri, droits sudo),
# avec kwin_wayland --virtual 6.6.6 (même version que le plugin). Publie sur ci-out/roundcorners-vm.
on:
  workflow_dispatch:
  push:
    paths: ['ci/roundcorners-vm.sh', '.github/workflows/roundcorners-vm.yml']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Paquets Plasma + PPA des coins arrondis (sudo)
        timeout-minutes: 25
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ca-certificates dbus dbus-x11 gpg software-properties-common \
            plasma-desktop plasma-workspace kwin-wayland kactivitymanagerd systemsettings \
            qt6-wayland libcap2-bin dolphin konsole libgl1-mesa-dri libegl-mesa0 libgbm1 libglx-mesa0 fonts-inter fonts-noto-core imagemagick xdg-user-dirs  > /tmp/apt-install.log 2>&1 \
            || { echo "::error::apt install: $(grep -E '^(E:|Err)' /tmp/apt-install.log | head -6 | tr '\n' '|')"; exit 1; }
          for group in "kde-spectacle spectacle" "kwin-style-aurorae aurorae" "qt6-style-kvantum qt-style-kvantum kvantum" "qt6-svg-plugins libqt6svg6"; do
            for p in $group; do sudo apt-get install -y --no-install-recommends "$p" >/dev/null 2>&1 && { echo "installé : $p"; break; }; done
          done
          dpkg -l 'kwin*' | grep '^ii' | cut -c1-80
      - name: Diagnostic apt du PPA sur cette VM
        run: |
          mkdir -p shots; sudo chmod 777 shots
          # Listes apt périmées préinstallées dans l'image de la VM (Translation-en du 5 mai) : on repart de zéro.
          sudo rm -rf /var/lib/apt/lists/ppa.launchpadcontent.net_matinlotfali* /var/lib/apt/lists/partial/*; sudo rm -f /etc/apt/sources.list.d/*rounded*
          { sudo add-apt-repository -y ppa:matinlotfali/kde-rounded-corners; sudo apt-get update 2>&1 | tail -15
            echo "== policy"; apt-cache policy kwin-effect-roundcorners
            echo "== listes"; ls -l /var/lib/apt/lists | grep -i rounded
            echo "== architectures"; dpkg --print-architecture; dpkg --print-foreign-architectures
            echo "== sources"; cat /etc/apt/sources.list.d/*rounded* 2>&1
            echo "== indextargets"; apt-get indextargets --format '$(SITE) $(ARCHITECTURE) $(CREATED_BY) $(FILENAME)' | grep -i rounded
            echo "== Release (curl)"; curl -sL https://ppa.launchpadcontent.net/matinlotfali/kde-rounded-corners/ubuntu/dists/resolute/InRelease | grep -E "^(Architectures|Components|Date)|binary-amd64" | head
            echo "== apt"; apt --version
          } > shots/apt-ppa-diag.txt 2>&1 || true
          cat shots/apt-ppa-diag.txt
      - name: Installer le paquet du PPA à la main (l'apt de cette VM n'indexe pas le PPA)
        run: |
          mkdir -p shots; sudo chmod 777 shots
          {
            cd /tmp; B=https://ppa.launchpadcontent.net/matinlotfali/kde-rounded-corners/ubuntu
            echo "== Packages.gz"; curl -sSL -o /tmp/Packages.gz -w "http=%{http_code} taille=%{size_download}\n" "$B/dists/resolute/main/binary-amd64/Packages.gz"
            zcat /tmp/Packages.gz > /tmp/ppa-Packages 2>&1; echo "zcat exit=$?"; grep -E '^(Package|Version|Filename|Depends):' /tmp/ppa-Packages | head -12
            F=$(awk '/^Package: kwin-effect-roundcorners$/{p=1} p&&/^Filename:/{print $2; exit}' /tmp/ppa-Packages); echo "Filename: [$F]"
            if [ -n "$F" ]; then
              curl -sSL -o "/tmp/$(basename "$F")" -w "deb http=%{http_code} taille=%{size_download}\n" "$B/$F"
              sudo dpkg -i "/tmp/$(basename "$F")" 2>&1 | tail -5
            fi
            echo "== etat"; dpkg -l kwin-effect-roundcorners 2>&1 | tail -2
          } > shots/manual-install.txt 2>&1 || true
          cat shots/manual-install.txt
      - name: Installer le thème du dépôt (root)
        run: |
          for c in themes icons lookfeel; do sudo -E env HOME=/root bash scripts/install-$c.sh || echo "::warning::install-$c a échoué"; done
      - name: Session Wayland, install-roundcorners.sh (install, status, undo) et captures
        run: |
          mkdir -p shots; sudo chmod 777 shots
          sudo -E env HOME=/root dbus-run-session -- bash ci/roundcorners-vm.sh shots || true
          sudo chmod -R a+rwX shots
          ls -l shots | head -40
          echo "== essai"; cat shots/kwin-essai.txt 2>&1; echo "== etat"; cat shots/etat.txt 2>&1 | head -60
      - name: Publier sur ci-out
        if: always()
        run: GITHUB_TOKEN=${{ github.token }} bash ci/publish.sh shots roundcorners-vm
