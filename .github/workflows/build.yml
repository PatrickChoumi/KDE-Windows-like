name: build-and-check

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  icontasks:
    runs-on: ubuntu-latest
    # Cible : Ubuntu 26.04 (Plasma 6.6). Si l'image n'existe pas, remplacer par ubuntu:25.10.
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      APP: plasma/applets/org.kde.windowsmodern.icontasks
    steps:
      - name: Dépendances de compilation
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build binutils
          # Chaque paquet séparément : un nom inconnu est signalé sans tout arrêter.
          for p in extra-cmake-modules qt6-base-dev qt6-declarative-dev qt6-tools-dev \
                   libkf6package-dev libkf6config-dev libkf6i18n-dev libkf6coreaddons-dev \
                   libkf6windowsystem-dev libkf6kio-dev libkf6service-dev libkf6xmlgui-dev \
                   libkf6notifications-dev libplasma-dev plasma-workspace-dev libksysguard-dev; do
            apt-get install -y --no-install-recommends "$p" || echo "::warning::paquet introuvable : $p"
          done
          # Les noms des paquets « activities » varient : on les cherche.
          echo "Candidats activities :"; apt-cache search --names-only 'activities.*(-dev)$' | tee /tmp/act.txt
          apt-get install -y --no-install-recommends $(cut -d' ' -f1 /tmp/act.txt) || true
      - uses: actions/checkout@v4

      - name: Garde-fou API (chaînes interdites sous Plasma 6.6)
        run: |
          if grep -rnE "Kirigami\.Badge|filterByCurrentVirtualDesktop" plasma; then
            echo "::error::API incompatible avec Plasma 6.6 détectée"; exit 1
          fi

      - name: Configuration
        run: cmake -S "$APP" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DKDE_INSTALL_USE_QT_SYS_PATHS=ON
      - name: Compilation
        run: cmake --build build
      - name: Contrôle du plugin compilé
        run: |
          so=$(find build -name 'org.kde.windowsmodern.icontasks.so' | head -1)
          test -n "$so" || { echo "::error::plugin introuvable"; exit 1; }
          ls -l "$so"
          if strings "$so" | grep -q "Kirigami.Badge"; then echo "::error::Kirigami.Badge dans le .so"; exit 1; fi
      - name: qmllint (informatif)
        continue-on-error: true
        run: |
          QML=$(command -v qmllint6 || command -v qmllint || ls /usr/lib/qt6/bin/qmllint 2>/dev/null)
          [ -n "$QML" ] && "$QML" "$APP"/contents/ui/*.qml || echo "qmllint indisponible"
      - uses: actions/upload-artifact@v4
        with:
          name: icontasks-so
          path: build/**/org.kde.windowsmodern.icontasks.so

  roundcorners:
    permissions:
      contents: write
    # Feature 5.1 : l'effet KWin de coins arrondis est-il installable sur Ubuntu 26.04 ? (conteneur jetable)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Dépôt PPA matinlotfali/kde-rounded-corners
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gpg software-properties-common
          add-apt-repository -y ppa:matinlotfali/kde-rounded-corners
          apt-get update
      - name: Le paquet existe-t-il pour cette version ?
        run: |
          cat /etc/os-release | head -3
          apt-cache policy kwin-effect-roundcorners
          apt-cache policy kwin-wayland kwin-x11 || true
          apt-cache show kwin-effect-roundcorners | grep -E '^(Package|Version|Depends|Architecture):' || { echo "::error::paquet introuvable"; exit 1; }
      - name: Simulation puis installation (conteneur jetable)
        run: |
          apt-get install -s kwin-effect-roundcorners | tee /tmp/sim.txt
          # Une simulation ne doit rien retirer.
          if grep -E '^Remv ' /tmp/sim.txt; then echo "::error::la simulation retire des paquets"; exit 1; fi
          apt-get install -y --no-install-recommends kwin-effect-roundcorners
      - name: Contrôle du résultat réel
        run: |
          dpkg -L kwin-effect-roundcorners | grep -E '\.so$|\.frag$' || { echo "::error::aucun fichier d'effet installé"; exit 1; }
          # Aucun fichier du paquet ne doit appartenir à un autre paquet.
          for f in $(dpkg -L kwin-effect-roundcorners | while read x; do [ -f "$x" ] && echo "$x"; done); do
            o=$(dpkg -S "$f" 2>/dev/null | cut -d: -f1 | sort -u | tr '\n' ' ')
            case "$o" in "kwin-effect-roundcorners ") ;; *) echo "::error::$f appartient à : $o"; exit 1 ;; esac
          done
          # Les traductions manquent dans l'image Docker (path-exclude) : on ne les compte pas.
          if dpkg -V kwin-effect-roundcorners | grep -v '/usr/share/locale/'; then echo "::error::dpkg -V signale des écarts"; exit 1; fi
          echo "dpkg -V : OK"
      - name: Édition de liens contre le vrai KWin 6.6 (kwin + KF6 installés)
        run: |
          # Dans le conteneur nu, ni KWin ni Qt n'existent : ldd y est sans valeur. On installe le vrai KWin.
          apt-get install -y --no-install-recommends kwin-wayland kwin-x11 libepoxy0 libkf6kcmutils6
          dpkg-query -W -f='${Package}=${Version}\n' kwin-wayland kwin-x11 kwin-effect-roundcorners
          bad=0
          for so in $(dpkg -L kwin-effect-roundcorners | grep -E '\.so$'); do
            echo "$so"; if ldd "$so" | grep -i "not found"; then bad=1; fi
          done
          [ "$bad" = 0 ] || { echo "::error::bibliothèques introuvables avec KWin installé"; exit 1; }
          echo "ldd : OK"
      - name: Publier le diagnostic sur la branche ci-logs-roundcorners
        if: always()
        run: |
          mkdir -p /tmp/pub && cd /tmp/pub
          {
            echo "== os"; head -3 /etc/os-release
            echo "== policy"; apt-cache policy kwin-effect-roundcorners
            echo "== dpkg -l kwin*"; dpkg -l 'kwin*' 2>&1 | head -30
            echo "== dpkg -L"; dpkg -L kwin-effect-roundcorners 2>&1
            echo "== proprietaires"
            for f in $(dpkg -L kwin-effect-roundcorners 2>/dev/null | while read x; do [ -f "$x" ] && echo "$x"; done); do echo "$f -> $(dpkg -S "$f" 2>&1 | cut -d: -f1 | sort -u | tr '\n' ' ')"; done
            echo "== dpkg -V"; dpkg -V kwin-effect-roundcorners 2>&1; echo "rc=$?"
            echo "== Depends"; apt-cache show kwin-effect-roundcorners | grep -E '^(Depends|Recommends):'
            echo "== kwin installé"; dpkg -l 'kwin*' 'libkf6kcmutils*' 2>&1 | grep '^ii' | cut -c1-90
            echo "== ldd"
            for so in $(dpkg -L kwin-effect-roundcorners 2>/dev/null | grep -E '\.so$'); do echo "$so"; ldd "$so" 2>&1 | grep -iE "not found" || echo "  ldd OK"; done
          } > diag.txt 2>&1
          apt-get install -y --no-install-recommends git >/dev/null 2>&1
          echo "run $GITHUB_RUN_ID $(date -u +%FT%TZ)" > RUN.txt
          git init -q -b ci-logs && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "roundcorners run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-roundcorners

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n sur tous les scripts
        run: |
          fail=0
          for f in install.sh uninstall.sh verify-all.sh scripts/*.sh plasma/applets/*/dev.sh; do
            [ -f "$f" ] && ! bash -n "$f" && { echo "::error file=$f::erreur de syntaxe"; fail=1; }
          done
          exit $fail
