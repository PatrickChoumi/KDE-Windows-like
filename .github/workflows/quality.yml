name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --yes imagemagick shellcheck
      - name: Test visual comparison tool
        run: bash scripts/test-visual-regression.sh
      - name: Lint visual scripts
        run: shellcheck scripts/visual-regression.sh scripts/test-visual-regression.sh
